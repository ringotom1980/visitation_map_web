name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate PHP syntax before publishing
        run: find config Public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET_DIR }}

          # 因為你的程式就在根目錄
          local-dir: ./ 

          protocol: ftps
          port: 21
          timeout: 60000

          exclude: |
            **/.git*
            **/.github*
            **/docs/**
            **/README.md
            **/LICENSE
            **/.env
            **/.env.*
            **/.ftp-deploy-sync-state.json
            **/scripts/local_preview.py
            **/scripts/preview_*.py
            **/scripts/preview_*.mjs
            **/scripts/verify_auth_cache.py
            **/__pycache__/**

          dangerous-clean-slate: false

      - name: Verify and update document-root admin routes
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: python .github/scripts/deploy_root_routes.py --apply

      - name: Preserve verified routing deployment metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-routing-result
          path: root-routing-result.json
          if-no-files-found: ignore
