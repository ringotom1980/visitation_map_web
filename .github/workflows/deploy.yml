name: Manual old-folder FTPS recovery (disabled for main push)

on:
  workflow_dispatch:
    inputs:
      recovery_ref:
        description: 'Explicit verified source for old-folder recovery only'
        required: true
        default: 'aecd3d649ec7db33ceabafae132228cac745f133'
        type: string

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.recovery_ref }}

      - name: Validate PHP syntax before publishing
        run: find config Public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET_DIR }}

          # 因為你的程式就在根目錄
          local-dir: ./ 

          protocol: ftps
          port: 21
          timeout: 60000

          exclude: |
            **/.git*
            **/.git/**
            **/.github*
            **/.github/**
            **/docs/**
            **/README.md
            **/LICENSE
            **/.env
            **/.env.*
            **/.ftp-deploy-sync-state.json
            **/scripts/local_preview.py
            **/scripts/preview_*.py
            **/scripts/preview_*.mjs
            **/scripts/verify_auth_cache.py
            **/__pycache__/**

          dangerous-clean-slate: false
